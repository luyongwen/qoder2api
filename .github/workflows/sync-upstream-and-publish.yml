name: Sync upstream and publish Docker image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream repository in owner/repository format
        required: true
        default: Zhengyuuuui/qoder2api
        type: string
      upstream_branch:
        description: Upstream branch to sync
        required: true
        default: main
        type: string

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPOSITORY: ${{ inputs.upstream_repo || 'Zhengyuuuui/qoder2api' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set GHCR image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$image" in
            ghcr.io/*) ;;
            *) echo "Invalid GHCR image name: $image" >&2; exit 1 ;;
          esac
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max